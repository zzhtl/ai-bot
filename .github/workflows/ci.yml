name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本由 rust-toolchain.toml 固定，这里只负责装上它
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # PDF 解析的测试要用 poppler；LibreOffice 太大不装，旧版 Office 的测试会自动跳过
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      # 编排层只认 AgentBackend，具体后端只能在装配代码（main.rs）里出现，接 Codex 时才不用动编排
      - name: backend boundary
        run: |
          ! grep -rnE --include='*.rs' 'ai_bot_agent::(\{[^}]*)?claude' crates/ai-bot/src \
            | grep -v '^crates/ai-bot/src/main.rs:'

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/feishu-go-ws/go.mod
          cache-dependency-path: tools/feishu-go-ws/go.sum
      - run: cargo build --release --locked -p ai-bot
      - run: go build -trimpath -o ../../target/release/feishu-go-ws .
        working-directory: tools/feishu-go-ws
      - name: Verify release binary against systemd
        run: |
          printf '%s\n' '[Service]' 'ExecStart=/usr/bin/sleep infinity' | sudo tee /run/systemd/system/ai-bot.service
          sudo systemctl daemon-reload
          target/release/ai-bot --help
          target/release/ai-bot --start
          systemctl is-active --quiet ai-bot
          before=$(systemctl show -p InvocationID --value ai-bot)
          target/release/ai-bot --restart
          systemctl is-active --quiet ai-bot
          after=$(systemctl show -p InvocationID --value ai-bot)
          test -n "$before"
          test -n "$after"
          test "$before" != "$after"
          target/release/ai-bot --stop
          test "$(systemctl show -p ActiveState --value ai-bot)" = inactive
      - name: Package Linux x86_64 binaries
        run: |
          tar -C target/release -czf ai-bot-linux-x86_64.tar.gz ai-bot feishu-go-ws
          sha256sum ai-bot-linux-x86_64.tar.gz | tee ai-bot-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ai-bot-linux-x86_64-${{ github.sha }}
          path: |
            ai-bot-linux-x86_64.tar.gz
            ai-bot-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
